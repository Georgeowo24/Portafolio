<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jorge TR - Portafolio</title>
    <!-- Base href es crucial en Blazor para el enrutamiento -->
    <base href="/Portafolio/" />

    <link rel="icon" href="resources/icons/code.ico">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="resources/styles/global.css">
    <link rel="stylesheet" href="resources/styles/navbar.css">
    <link rel="stylesheet" href="resources/styles/index.css">
    
    <!-- Te sugiero agregar aquí los demás CSS para tenerlos listos -->
    <link rel="stylesheet" href="resources/styles/about.css">
    <link rel="stylesheet" href="resources/styles/contact.css">
    <link rel="stylesheet" href="resources/styles/recognition.css">
</head>
<body>
    <!-- Partículas de fondo fuera del contenedor de Blazor -->
    <div id="particles-js"></div>

    <!-- Contenedor principal de Blazor WebAssembly -->
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text">Cargando portafolio...</div>
    </div>

    <!-- Script principal de Blazor -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Tus scripts de UI y Animaciones -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="resources/scripts/particles.js"></script>
    <!-- ... llamadas a tus scripts ... -->
    <script src="resources/scripts/typed.js"></script>
    <script src="resources/scripts/spans.js"></script>
    <script src="resources/scripts/timeline.js"></script>
    
    <!-- Funciones puente para Blazor -->
    <script>
        window.inicializarScriptsInicio = () => {
            if (typeof window.initTyped === 'function') window.initTyped();
            if (typeof window.initSpans === 'function') window.initSpans();
        };

        window.inicializarTimeline = () => {
            if (typeof window.initTimeline === 'function') window.initTimeline(); 
        };
    </script>
</body>
</html>
